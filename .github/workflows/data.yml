name: Data snapshot

# Fetches the open datasets Zeer is built on and commits them back to the branch
# that triggered the run. It exists because the cloud VM that builds the site has
# an egress allowlist that blocks NASA POWER and the source documents; GitHub's
# runners reach them directly. Every file it writes is reproducible from the
# scripts in scripts/data/.
on:
  push:
    paths:
      - 'scripts/data/**'
      - 'data/towns.json'
      - 'data/sources.txt'
      - '.github/workflows/data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: NASA POWER climatology for every town
        run: python3 scripts/data/fetch_power.py
      - name: Source documents and field datasets
        run: bash scripts/data/fetch_sources.sh
      - name: Commit the snapshot
        run: |
          git config user.name 'Rishik Rontala'
          git config user.email '297979650+rishikrrontala-bot@users.noreply.github.com'
          git add data/raw
          if git diff --cached --quiet; then echo 'No new data.'; exit 0; fi
          git commit -m "Data snapshot: NASA POWER climatology + source documents [skip ci]" \
            -m "Fetched by .github/workflows/data.yml run ${{ github.run_id }}."
          for i in 1 2 3 4; do
            git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2**i))
          done
          exit 1
